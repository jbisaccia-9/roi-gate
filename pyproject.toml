[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "roigate"
version = "0.1.0"
description = "Adoption/ROI model that refuses to report a number it can't defend"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["pytest"]
obs = ["braintrust"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
